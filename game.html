<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F급 탈출 프로젝트 — CONTRACT : ZERO 30 DAYS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{--bg:#0b0f22;--ink:#eef2ff;--mute:#9aa6c8;--dim:#5f6a90;--gold:#f2cf6a;--blue:#5b9dff;--line:#eef2ff;--px:'Galmuri11','Galmuri9','DungGeunMo','Noto Sans KR',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden;background:#05070f;color:var(--ink);font-family:var(--px);-webkit-font-smoothing:none;touch-action:manipulation}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body{min-height:100svh;display:flex;justify-content:center;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:480px;padding:calc(8px + env(safe-area-inset-top)) 8px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
/* pixel box */
.pb{--fr:#eef2ff;position:relative;background:linear-gradient(180deg,#151d48,#0c1230);margin:3px;
  box-shadow:0 -3px 0 0 var(--fr),0 3px 0 0 var(--fr),-3px 0 0 0 var(--fr),3px 0 0 0 var(--fr),
  0 -6px 0 0 #05070f,0 6px 0 0 #05070f,-6px 0 0 0 #05070f,6px 0 0 0 #05070f,
  3px 3px 0 0 #05070f,-3px 3px 0 0 #05070f,3px -3px 0 0 #05070f,-3px -3px 0 0 #05070f,
  inset 0 3px 0 0 rgba(255,255,255,.10),inset 0 -3px 0 0 rgba(0,0,0,.35)}
.pb.gold{--fr:#f2cf6a}
.pb.dark{background:#080b1a}
/* hud */
.hud{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px}
.hud .day{color:var(--gold);font-size:14px}
.hud .slot{color:var(--mute)}
.hud .sp{flex:1}
.hud .stam{display:flex;align-items:center;gap:6px}
.hud .stam i{display:block;width:70px;height:8px;background:#26305a;position:relative}
.hud .stam i b{position:absolute;inset:0;width:var(--w,100%);background:#57d46b}
.hud .stam.low i b{background:#ff5f5f}
.snd{font-size:11px;padding:3px 6px;border:2px solid #eef2ff;color:var(--mute)}
.snd.on{color:var(--gold);border-color:var(--gold)}
/* stage */
.stage{position:relative;line-height:0}
#cv{width:100%;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000;touch-action:manipulation}
.dlg{position:relative;margin:12px 6px 6px;min-height:92px;padding:16px 12px 16px;line-height:1.55;font-size:13.5px;display:block;cursor:pointer;background:linear-gradient(180deg,rgba(14,20,52,.96),rgba(8,11,28,.96))}
.dlg.hasp{padding-left:88px}
.dlg .por{position:absolute;left:8px;top:10px;width:68px;height:68px;image-rendering:pixelated;display:none;background:#05070f;box-shadow:0 0 0 2px #05070f,0 0 0 4px var(--wc,#3a6fc4),0 0 0 6px #05070f}
.dlg.hasp .por{display:block}
.dlg:not(.on){cursor:default}
.dlg:not(.on) .txt:empty::before{content:'▶ 무엇을 할까? 아래에서 행동을 골라 주세요.';color:#5f6a90}
.dlg:not(.on) .nx{display:none}
.dlg .who{position:absolute;top:-12px;left:8px;box-shadow:2px 2px 0 #05070f;padding:2px 8px;font-size:12px;background:var(--wc,#3a6fc4);border:2px solid #eef2ff;line-height:1.3}
.dlg .who:empty{display:none}
.dlg .txt.nar{color:#c3cde8}
.dlg .nx{position:absolute;right:8px;bottom:4px;font-size:10px;color:var(--gold);animation:bl .8s steps(2) infinite}
.dlg.typing .nx{visibility:hidden}
.dlg.hasp .who{left:88px}
.logo{position:absolute;left:0;right:0;top:10px;text-align:center;line-height:1.1;pointer-events:none;display:none;z-index:4}
.logo.on{display:block}
.logo b{display:block;font-size:26px;font-weight:400;color:#fff6d6;text-shadow:2px 0 #2a1a5a,-2px 0 #2a1a5a,0 2px #2a1a5a,0 -2px #2a1a5a,3px 3px 0 #5b3ad0,4px 4px 0 #05070f;letter-spacing:.04em}
.logo small{display:inline-block;margin-top:6px;font-size:10px;letter-spacing:.3em;color:#f2cf6a;text-shadow:1px 1px 0 #05070f;padding:2px 8px;background:rgba(5,7,15,.6)}
.splash{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#05070f;z-index:8;line-height:1.2}
.splash.on{display:flex;animation:spl 1.6s steps(8) forwards}
@keyframes spl{0%{clip-path:inset(0 100% 0 0)}20%{clip-path:inset(0 0 0 0)}80%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 100%)}}
.splash b{font-size:34px;font-weight:400;color:#f2cf6a;text-shadow:3px 3px 0 #2a1a5a}
.splash small{font-size:12px;color:#9aa6c8;margin-top:6px}
.hud .ico{width:16px;height:16px;image-rendering:pixelated}
.hud .stam i{width:84px;height:10px;background:#1c2448;box-shadow:0 0 0 2px #05070f}
.hud .stam i b{background:repeating-linear-gradient(90deg,#57d46b 0 7px,#2f9a45 7px 8px)}
.hud .stam.low i b{background:repeating-linear-gradient(90deg,#ff5f5f 0 7px,#a82a2a 7px 8px)}
.stat{grid-template-columns:16px 46px minmax(0,1fr) 24px!important;white-space:nowrap;font-size:11.5px}
.stat canvas{width:16px;height:16px;image-rendering:pixelated}
.act{box-shadow:0 -3px 0 0 #eef2ff,0 3px 0 0 #eef2ff,-3px 0 0 0 #eef2ff,3px 0 0 0 #eef2ff,4px 4px 0 1px #05070f!important;border:0!important;margin:3px;background:linear-gradient(180deg,#1a2350,#111838)!important}
.act:not(:disabled):hover{box-shadow:0 -3px 0 0 #f2cf6a,0 3px 0 0 #f2cf6a,-3px 0 0 0 #f2cf6a,3px 0 0 0 #f2cf6a,4px 4px 0 1px #05070f!important}
.act:not(:disabled):active{transform:translate(2px,2px)}
.act.sp{background:linear-gradient(180deg,#3a2a5e,#241a40)!important;box-shadow:0 -3px 0 0 #f2cf6a,0 3px 0 0 #f2cf6a,-3px 0 0 0 #f2cf6a,3px 0 0 0 #f2cf6a,4px 4px 0 1px #05070f!important}
.big{border:0!important;margin:9px 3px 0;width:calc(100% - 6px)!important;box-shadow:0 -3px 0 0 #eef2ff,0 3px 0 0 #eef2ff,-3px 0 0 0 #eef2ff,3px 0 0 0 #eef2ff,5px 5px 0 1px #05070f!important;background:linear-gradient(180deg,#3a4fb0,#24337a)!important}
.big.gold{background:linear-gradient(180deg,#b88a2a,#7a5a14)!important;box-shadow:0 -3px 0 0 #f2cf6a,0 3px 0 0 #f2cf6a,-3px 0 0 0 #f2cf6a,3px 0 0 0 #f2cf6a,5px 5px 0 1px #05070f!important}
.tcard{border:0!important;margin:3px;box-shadow:0 -3px 0 0 #39457a,0 3px 0 0 #39457a,-3px 0 0 0 #39457a,3px 0 0 0 #39457a,4px 4px 0 1px #05070f!important}
.tcard.on{box-shadow:0 -3px 0 0 #f2cf6a,0 3px 0 0 #f2cf6a,-3px 0 0 0 #f2cf6a,3px 0 0 0 #f2cf6a,4px 4px 0 1px #05070f!important}
.choices button{border:0!important;margin:2px;box-shadow:0 -3px 0 0 #eef2ff,0 3px 0 0 #eef2ff,-3px 0 0 0 #eef2ff,3px 0 0 0 #eef2ff,4px 4px 0 1px #05070f!important;background:linear-gradient(180deg,#1a2350,#0e1430)!important}
.choices button:hover,.choices button:focus-visible{box-shadow:0 -3px 0 0 #f2cf6a,0 3px 0 0 #f2cf6a,-3px 0 0 0 #f2cf6a,3px 0 0 0 #f2cf6a,4px 4px 0 1px #05070f!important}
@keyframes bl{50%{opacity:0}}
.choices{position:absolute;left:10px;right:10px;display:none;flex-direction:column;gap:6px;line-height:1.4;z-index:5}
.choices.on{display:flex}
.choices button.sel{box-shadow:0 -3px 0 0 #f2cf6a,0 3px 0 0 #f2cf6a,-3px 0 0 0 #f2cf6a,3px 0 0 0 #f2cf6a,4px 4px 0 1px #05070f!important;color:#fff6c8}
.choices button.sel::before{content:'▶ ';color:#f2cf6a}
.choices.grid.on{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.choices.grid button{padding:7px 8px;font-size:12.5px}
.choices button{text-align:left;padding:8px 10px;font-size:13px;background:#0e1430;border:3px solid #eef2ff;box-shadow:3px 3px 0 #000}
.choices button:hover,.choices button:focus-visible{border-color:var(--gold);color:var(--gold);outline:none}
.choices button::before{content:'▶ ';color:var(--gold);visibility:hidden}
.choices button:hover::before{visibility:visible}
.pops{position:absolute;right:8px;top:40px;align-items:flex-end;display:flex;flex-direction:column;gap:3px;pointer-events:none;line-height:1.2;z-index:6}
.pops span{font-size:12px;padding:2px 6px;background:rgba(5,7,15,.85);border:2px solid #eef2ff;animation:popup 1.8s steps(6) forwards;width:max-content}
.pops span.dn{border-color:#ff7a7a;color:#ffb0b0}
.pops span.up{border-color:#7af09a;color:#c8ffd6}
.pops span.bd{border-color:#ff9cc0;color:#ffd0e2}
@keyframes popup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
.tap{position:absolute;left:10px;top:8px;font-size:11px;color:var(--gold);line-height:1;display:none;animation:bl .8s steps(2) infinite}
.tap.on{display:block}
/* panel */
.panel{padding:10px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:12px;margin-bottom:10px}
.stat{display:grid;grid-template-columns:44px minmax(0,1fr) 26px;align-items:center;gap:6px}
.stat .bar{height:10px;background:#1c2448;position:relative;border:2px solid #05070f;outline:1px solid #39457a}
.stat .bar b{position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);background:var(--sc,#5b9dff);transition:width .5s steps(8)}
.stat .bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(5,7,15,.6) 9% 10%)}
.stat .v{text-align:right;color:var(--mute)}
.rankrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:-2px 0 10px;color:var(--mute)}
.rankrow b{color:var(--gold);font-size:15px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.act{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;text-align:left;padding:7px 8px;background:#121a3c;border:3px solid #eef2ff;box-shadow:3px 3px 0 #000;line-height:1.3}
.act:not(:disabled):active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.act:not(:disabled):hover{border-color:var(--gold)}
.act:disabled{opacity:.35}
.act canvas{width:28px;height:28px;image-rendering:pixelated}
.act b{display:block;font-size:13px;font-weight:400}
.act small{display:block;font-size:10.5px;color:var(--mute)}
.act.sp{border-color:var(--gold);background:#2a2440}
.act.warn small{color:#ff9a9a}
.note{font-size:11px;color:var(--dim);text-align:center;margin-top:8px;line-height:1.5}
/* title & select */
.big{display:block;width:100%;padding:12px;font-size:15px;text-align:center;background:#2a3b8a;border:3px solid #eef2ff;box-shadow:4px 4px 0 #000;margin-top:8px}
.big.gold{background:#8a6a1a;border-color:var(--gold);color:#fff6d6}
.big:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.big:disabled{opacity:.4}
.sel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tcard{display:flex;flex-direction:column;align-items:center;padding:8px 6px 10px;background:#121a3c;border:3px solid #39457a;box-shadow:3px 3px 0 #000;text-align:center;line-height:1.35}
.tcard.on{border-color:var(--gold);background:#272044}
.tcard canvas{width:64px;height:96px;image-rendering:pixelated}
.tcard .por{width:40px;height:40px;image-rendering:pixelated;position:absolute;right:6px;top:6px;box-shadow:0 0 0 2px #05070f}
.tcard{position:relative}
.tcard b{font-size:13px;font-weight:400;margin-top:4px}
.tcard small{font-size:10.5px;color:var(--mute)}
.tinfo{margin-top:10px;padding:10px;font-size:12px;line-height:1.6;background:#0a0f26;border:2px dashed #39457a}
.tinfo b{color:var(--gold);font-weight:400}
.nin{display:flex;gap:8px;margin-top:10px}
.nin input{flex:1;min-width:0;padding:10px;background:#05070f;border:3px solid #eef2ff;color:#fff;font:inherit;font-size:16px;outline:none}
.nin input:focus{border-color:var(--gold)}
.foot{font-size:10.5px;color:var(--dim);text-align:center;line-height:1.7;margin-top:4px}
.foot a{color:var(--mute)}
.endbox{font-size:13px;line-height:1.7}
.endbox h3{font-weight:400;color:var(--gold);font-size:18px;margin-bottom:4px}
.endbox .rk{font-size:40px;color:#fff;text-shadow:3px 3px 0 #2a3b8a;line-height:1.1}
.endbox ul{list-style:none;margin:8px 0;font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .big{flex:1;min-width:120px;font-size:13px;padding:10px 6px}
.hide{display:none!important}
/* ---- RPG controls & overlays ---- */
.pad{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 4px;-webkit-user-select:none;user-select:none;touch-action:none}
.dpad{position:relative;width:138px;height:138px;flex:none}
.dpad button,.abtn,.sbtn{background:linear-gradient(180deg,#26306a,#141a40);color:#eef2ff;box-shadow:0 -3px 0 0 #eef2ff,0 3px 0 0 #eef2ff,-3px 0 0 0 #eef2ff,3px 0 0 0 #eef2ff,4px 4px 0 1px #05070f;touch-action:none;-webkit-user-select:none;user-select:none}
.dpad button{position:absolute;width:44px;height:44px;font-size:16px;line-height:1}
.dpad button.on,.abtn.on,.sbtn:active{background:linear-gradient(180deg,#f2cf6a,#a8801e);color:#1a1405;transform:translate(1px,1px)}
.dpad [data-d=up]{left:47px;top:0}.dpad [data-d=left]{left:0;top:47px}.dpad [data-d=right]{left:94px;top:47px}.dpad [data-d=down]{left:47px;top:94px}
.dpad i{position:absolute;left:53px;top:53px;width:32px;height:32px;background:#0b1024;box-shadow:0 0 0 3px #39457a}
.rbtns{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.abtn{width:80px;height:80px;font-size:26px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%);box-shadow:none;border:0;background:linear-gradient(180deg,#c43a52,#7a1a2c)}
.abtn small{font-size:10px;margin-top:2px;color:#ffd6de}
.sbtns{display:flex;gap:10px}
.sbtn{padding:7px 10px;font-size:12px;margin:3px}
.txt.idle{color:#8f9bc0}
#ov{position:fixed;inset:0;z-index:50;background:rgba(5,7,15,.72);display:flex;align-items:center;justify-content:center;padding:18px}
#ov.hide{display:none}
.ovbox{width:min(440px,100%);padding:14px;max-height:90svh;overflow:auto}
.ovh{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--gold);margin-bottom:10px}
.ovx{font-size:14px;padding:2px 8px;box-shadow:0 0 0 2px #eef2ff}
#mm{width:100%;image-rendering:pixelated;box-shadow:0 0 0 3px #05070f,0 0 0 5px #39457a}
.ovl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.ovl button{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13px;background:linear-gradient(180deg,#1a2350,#111838);box-shadow:0 -3px 0 0 #eef2ff,0 3px 0 0 #eef2ff,-3px 0 0 0 #eef2ff,3px 0 0 0 #eef2ff;margin:3px;text-align:left}
.ovl button canvas{width:16px;height:16px;image-rendering:pixelated}
.ovl button b{color:var(--gold);font-weight:400;margin-left:auto}
.stinfo{display:flex;gap:12px;align-items:center;margin-bottom:12px;font-size:12px;line-height:1.6}
.stinfo img{width:60px;height:60px;image-rendering:pixelated;box-shadow:0 0 0 2px #05070f,0 0 0 4px #3a6fc4}
.stinfo b{font-size:15px;font-weight:400;color:#fff}.stinfo em{font-style:normal;color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="pb hud" id="hud"><canvas class="ico" id="hIco" width="8" height="8"></canvas><span class="day" id="hDay">CONTRACT : ZERO</span><span class="slot" id="hSlot"></span><span class="sp"></span><span class="stam hide" id="hStam">체력<i><b></b></i></span><button class="snd" id="snd">♪ OFF</button></div>
  <div class="pb stage" id="stage">
    <canvas id="cv" width="192" height="144"></canvas>
    <div class="pops" id="pops"></div>
    <div class="tap" id="tap">TAP!</div>
    <div class="choices" id="choices"></div>
    <div class="logo" id="logo"><b>F급 탈출 프로젝트</b><small>CONTRACT : ZERO · 30 DAYS</small></div>
    <div class="splash" id="splash"><b id="splD">DAY 1</b><small id="splS"></small></div>
    <div class="pb dlg" id="dlg"><img class="por" id="por" alt=""><div class="who" id="who"></div><div class="txt" id="txt"></div><div class="nx">▼</div></div>
  </div>
  <div class="pad hide" id="pad">
    <div class="dpad" id="dpad"><button data-d="up" aria-label="위">▲</button><button data-d="left" aria-label="왼쪽">◀</button><button data-d="right" aria-label="오른쪽">▶</button><button data-d="down" aria-label="아래">▼</button><i></i></div>
    <div class="rbtns"><button class="abtn" id="bA">A<small>조사·대화</small></button><div class="sbtns"><button class="sbtn" id="bMap">지도</button><button class="sbtn" id="bSt">상태</button></div></div>
  </div>
  <div class="pb panel" id="panel"></div>
  <div id="ov" class="hide"></div>
  <div class="foot">팬메이드 미니게임 · 원작 플롯 「CONTRACT : ZERO」 © ⭐_MEI<br><a href="./index.html">← 소개 사이트로 돌아가기</a></div>

function timing(rounds,opt){

    const results=[];let round=0;let x=36,dir=1,shown=null,showT=0;

      draw(){
        R(g,30,22,132,14,'#05070f');R(g,32,24,128,10,'#1c2448');const zw=zoneW();R(g,zc-zw/2,24,zw,10,'#3a6fc4');R(g,zc-zw/6,24,zw/3,10,'#f2cf6a');
        if(!shown){x+=spd*dir;if(x>158){x=158;dir=-1}if(x<34){x=34;dir=1}}
        R(g,x-1,20,3,18,'#ffffff');R(g,x-2,19,5,2,'#ffffff');
        for(let i=0;i<rounds;i++)R(g,82+i*12,40,8,4,results[i]==null?'#39457a':results[i]===2?'#f2cf6a':results[i]===1?'#5b9dff':'#ff5f5f');
        if(shown){g.font='10px Galmuri11, monospace';g.fillStyle=shown==='GREAT'?'#f2cf6a':shown==='GOOD'?'#9fd0ff':'#ff8a8a';g.textAlign='center';g.fillText(shown,96,58);if(--showT<=0){shown=null;if(round>=rounds){SCN.mg=null;$('tap').classList.remove('on');res(results)}else{zc=rnd(50,142)}}}
      },

async function duel(foe){

  const F=foe==='ca'?{name:'카밀라 & 이프리트',hp:42,atk:6,big:14,cast:['ca','if']}:{name:'연습용 골렘',hp:26,atk:4,big:10,cast:['golem']};

  let intent='atk',lastBig=false;
  const nextIntent=()=>{const r=Math.random();intent=(!lastBig&&r<.3)?'big':r<.55?'guard':'atk';lastBig=intent==='big'};
  SCN.mg={draw(){
    R(g,4,4,86,14,'#05070f');R(g,6,6,82*S.ah/S.am,4,'#57d46b');R(g,6,12,82,2,'#1c2448');
    R(g,102,4,86,14,'#05070f');R(g,104,6,82*S.eh/S.em,4,'#ff5f5f');
    g.font='8px Galmuri9, monospace';g.fillStyle='#eef2ff';g.textAlign='left';g.fillText('엘리나 팀 '+S.ah,6,24);g.textAlign='right';g.fillText(S.eh+' '+(foe==='ca'?'카밀라 팀':'골렘'),186,24);
    if(S.stun){g.textAlign='center';g.fillStyle='#cfd8f0';g.fillText('석화!',150,70)}
  }};
  const tells={golem:{atk:'골렘이 팔을 치켜든다.',big:'골렘의 눈이 붉게 빛난다… (강공 예고!)',guard:'골렘이 몸을 웅크린다. (방어 자세)'},
               ca:{atk:'카밀라가 손끝에 불씨를 모은다.',big:'이프리트의 불꽃이 거세게 타오른다…! (강공 예고!)',guard:'카밀라가 한 발 물러나 자세를 낮춘다. (방어 자세)'}};
  const SPN={st:'석화의 시선',po:'맹독',ho:'호왕화',th:'흑뢰섬'};
  if(foe==='ca')await say('ca','좋아, 규격외! 오늘은 네 실력을 직접 봐야겠어!');else await say('n','결투장 구석, 연습용 골렘이 삐걱거리며 일어선다.');
  nextIntent();
  while(S.eh>0&&S.ah>0&&S.turn<8){
    S.turn++;
    await say('n',(S.stun?'상대는 아직 굳어 있다!':tells[foe][intent])+`  [${S.turn}/8턴]`);
    const opts=['⚔ 공격','🛡 방어',`✦ 빛 마법 (${S.light})`,S.sp?`★ ${SPN[G.type]}`:'★ (사용함)'];
    let c=await ask(opts,true);
    if((c===2&&!S.light)||(c===3&&!S.sp)){await say('sys','지금은 쓸 수 없어요. 공격으로 대신한다!');c=0}
    let dmg=0,guarding=false;
    if(c===0){dmg=Math.round((4+Math.floor(G.st.mana/14))*boostFor('duel')*(S.power?2:1));if(S.power)S.power--;if(intent==='guard'&&!S.stun)dmg=Math.round(dmg*.4);await hitFoe(F,dmg,'당신의 공격!')}
    if(c===1){guarding=true;await say('n','당신이 엘리나 앞을 막아서며 자세를 낮춘다.')}
    if(c===2){S.light--;dmg=3+Math.floor(G.st.light/12);SCN.flash=6;SND.fx('magic');await say('el',pick(['비, 빛이여…!','지금이에요!','제 빛… 닿아라!']));await hitFoe(F,dmg,'엘리나의 빛이 꽂힌다!')}
    if(c===3){S.sp=0;SND.fx('magic');
      if(G.type==='st'){S.stun=2;await say('n','석화의 시선 — 상대의 몸이 돌처럼 굳었다!')}
      if(G.type==='po'){S.poison=3;await hitFoe(F,3,'독니가 스친다! 맹독이 퍼진다.')}
      if(G.type==='ho'){S.power=2;await say('n','호왕화! 거대한 호랑이의 기운이 몸을 감싼다. (다음 공격 2번 ×2)')}
      if(G.type==='th'){await hitFoe(F,10+Math.floor(G.st.mana/20),'흑뢰섬! 검은 번개가 내리꽂힌다!')}}
    if(S.eh<=0)break;
    if(S.poison){S.poison--;await hitFoe(F,3,'맹독이 퍼진다.')}
    if(S.eh<=0)break;
    // enemy acts
    if(S.stun){S.stun--;if(!S.stun)await say('n','상대가 겨우 움직이기 시작한다.')}
    else if(intent==='guard'){await say('n','상대는 방어 자세를 유지한다.')}
    else{let d=intent==='big'?F.big:F.atk;if(guarding)d=Math.round(d*(intent==='big'?.25:.3));
      SCN.shake=10;SCN.hit.el=6;SCN.hit.you=6;SND.fx('hit');S.ah=Math.max(0,S.ah-d);
      await say('n',(intent==='big'?(foe==='ca'?'홍염이 폭발한다!':'골렘의 강타!'):(foe==='ca'?'불꽃이 날아든다!':'골렘의 주먹!'))+` ${d}의 피해${guarding?' (막았다!)':''}.`)}
    nextIntent();
  }
  SCN.mg=null;const win=S.eh<=0;
  if(win){SND.fx('win');sparkle(20,140,90);G.wins++}else SND.fx('lose');
  return win;
  async function hitFoe(F,d,msg){S.eh=Math.max(0,S.eh-d);SCN.shake=6;F.cast.forEach(k=>SCN.hit[k]=6);SND.fx('hit');await say('n',`${msg} ${d}의 피해.`)}
}

  ov.querySelectorAll('[data-ic]').forEach(e=>e.replaceWith(iconCanvas(e.dataset.ic)));
  const mm=$('mm').getContext('2d');mm.imageSmoothingEnabled=true;mm.drawImage(mapCanvas('campus'),0,0,32*4,26*4);
  const here=WD.map==='campus'?[WD.x,WD.y]:{dorm:[26,21],roof:[26,21],class:[16,7],exam:[16,7],library:[5,6],arena:[27,7]}[WD.map];
  mm.fillStyle='#05070f';mm.fillRect(here[0]*4-1,here[1]*4-1,6,6);mm.fillStyle=G.type==='ho'||G.type==='th'?'#b68cf2':'#6cdcbc';mm.fillRect(here[0]*4,here[1]*4,4,4);
  $('ovx').onclick=closeOv;
  ov.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const k=b.dataset.go;closeOv();SND.fx('blip');WD.labelT=90;
    const T_={dorm:['dorm',5,7,'up'],class:['class',6,8,'up'],library:['library',6,8,'up'],field:['campus',6,15,'down'],plaza:['campus',16,17,'up'],arena:['arena',6,9,'up'],roof:['roof',2,5,'right']}[k];warp(...T_)});
}
function questLoc(){const q=G&&EVLOC[G.day];if(!q||G.flags['ev'+G.day]||G.slot>=2)return null;if(q.zone)return q.zone;return q.map==='exam'?'class':q.map}
function openStatus(){
  if(MODE!=='map'||busy)return;SND.fx('ok');const ov=$('ov');ov.classList.remove('hide');const sp=SPECIAL[G.type];
  ov.innerHTML=`<div class="pb ovbox"><div class="ovh">상태 <button class="ovx" id="ovx">✕</button></div>
    <div class="stinfo"><img src="${PXA.por.el}" alt=""><div><b>엘리나 세리브</b><br><span>예상 등급 <em id="rk">F</em> · 계약 사역마 ${esc(G.name)}</span><br><span>DAY ${G.day}/30 · ${['오전','오후','밤'][Math.min(G.slot,2)]} · 결투 ${G.wins}승</span></div></div>
    <div class="stats" id="stats"></div>
    <div class="note" style="text-align:left">· 활동(수업·훈련·공부·결투·휴식·벤치·전용 행동)을 하면 시간이 흘러요. 하루 2번.<br>· 걷기, 대화, 지도 이동은 시간이 들지 않아요.<br>· 전용 행동 「${sp.n}」은 엘리나에게 말을 걸어서!${G.buff.kain>0?`<br>· 카인의 조언: 수업·훈련 +20% (${G.buff.kain}일)`:''}</div>
    <div class="row"><button class="big" id="stSave">저장하고 타이틀로</button></div></div>`;
  panelStats();$('ovx').onclick=closeOv;$('stSave').onclick=()=>{save();closeOv();titleScreen()};
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

/* ---------------- idle hint in the text window ---------------- */
function idleHint(){
  if(!G||dlg.classList.contains('on')||MODE!=='map')return;let t;
  if(G.slot>=2)t='🌙 밤이 되었다. 기숙사 침대로 가서 하루를 마치자.';
  else{const q=EVLOC[G.day];if(q&&!G.flags['ev'+G.day])t=`❗ ${q.hint}  (지도에 ! 표시)`;else t=`☀ ${['오전','오후'][G.slot]} · 오늘 남은 활동 ${2-G.slot}번. 어디로 갈까?`}
  $('txt').textContent=t;$('txt').classList.add('idle');
}

/* ---------------- title & select ---------------- */
function titleScreen(){
  MODE='title';$('pad').classList.add('hide');$('panel').classList.remove('hide');closeOv();
  G=null;hud();hideDlg();scene('title',2,[{k:'le',x:10,y:86},{k:'ca',x:44,y:88},{k:'el',x:80,y:84},{k:'ka',x:116,y:88,flip:true},{k:'as',x:150,y:86,flip:true}]);SND.setMode('title');
  const sv=load();
  panel.innerHTML=`<div style="text-align:center;line-height:1.7;font-size:12.5px;color:#cfd8f0;padding:2px 0 4px">규격외 사역마가 되어, F급 사역사 엘리나를<br><b style="color:var(--gold);font-weight:400">30일 안에 재평가 시험에 합격</b>시켜라!</div>
    ${sv?`<button class="big gold" id="tCont">이어하기 · DAY ${sv.day} · ${sv.name.replace(/[<>&]/g,'')}</button>`:''}
    <button class="big ${sv?'':'gold'}" id="tNew">새로 시작</button>
    <button class="big" id="tSnd">${SND.on?'♪ 소리 끄기':'♪ 소리 켜기'}</button>
    <div class="note">엔딩 11종 · 계열별 대사 · 자동 저장</div>`;
  $('tNew').onclick=()=>{if(sv&&!confirmNew())return;selectScreen()};
  if(sv)$('tCont').onclick=()=>{G=sv;startGame(true)};
  $('tSnd').onclick=()=>{SND.toggle();$('tSnd').textContent=SND.on?'♪ 소리 끄기':'♪ 소리 켜기'};
}
let confirmArmed=false;function confirmNew(){if(confirmArmed){confirmArmed=false;return true}confirmArmed=true;$('tNew').textContent='한 번 더 누르면 저장이 지워져요';setTimeout(()=>{confirmArmed=false;const b=$('tNew');if(b)b.textContent='새로 시작'},2500);return false}
function selectScreen(){
  let pickT=null;scene('field',2,[]);SND.fx('ok');
  panel.innerHTML=`<div style="font-size:13px;margin-bottom:8px">당신은 어떤 모습으로 응답했나요?</div>
    <div class="sel" id="sel">${Object.keys(TYPES).map(k=>`<button class="tcard" data-t="${k}"><img class="por" src="${PXA.por[k]}" alt=""><canvas width="32" height="48"></canvas><b>${TYPES[k].n}</b><small>${TYPES[k].k}</small></button>`).join('')}</div>
    <div class="tinfo" id="tinfo">계열을 고르면 특성과 전용 행동이 보여요.</div>
    <div class="nin"><input id="nm" maxlength="8" placeholder="사역마의 이름 (바꿀 수 있어요)" autocomplete="off"></div>
    <button class="big gold" id="go" disabled>엘리나에게 응답한다</button>`;
  document.querySelectorAll('.tcard').forEach(b=>{const c=b.querySelector('canvas').getContext('2d');c.imageSmoothingEnabled=false;const im=spr(b.dataset.t);const dr=()=>c.drawImage(im,0,0);im.complete?dr():im.onload=dr;
    b.onclick=()=>{pickT=b.dataset.t;SND.fx('blip');document.querySelectorAll('.tcard').forEach(x=>x.classList.toggle('on',x===b));
      $('tinfo').innerHTML=`<b>${TYPES[pickT].n}</b><br>특성 · ${TYPES[pickT].p}<br>전용 행동 · 「${SPECIAL[pickT].n}」 ${SPECIAL[pickT].d}`;
      scene('field',2,[{k:pickT,x:80}]);const nmI=$('nm');if(!nmI.value.trim()||Object.values(TYPES).some(t=>t.n===nmI.value.trim()))nmI.value=TYPES[pickT].n;check()}});
  const check=()=>{$('go').disabled=!(pickT&&$('nm').value.trim())};$('nm').oninput=check;
  $('go').onclick=()=>{const nm=$('nm').value.trim().slice(0,8);if(!pickT||!nm)return;G=NEWG(pickT,nm);save();startGame(false)};
}
async function startGame(resume){
  $('panel').classList.add('hide');$('pad').classList.remove('hide');SND.setMode(G.slot>=2?'night':'day');hud();
  if(!resume){MODE='map';warp('dorm',4,4,'down',true);G.flags.ev1=1;await runCut(async()=>{await EVENTS[1]()});
    await runCut(async()=>{await say('sys','[조작] ◀▲▼▶ 로 걷고, A 버튼으로 조사·대화해요. 지도 버튼으로 장소 이동!');await say('sys','노란 테두리와 이름표가 붙은 곳(책상·마법진·열람석·결투장·벤치·침대)에서 활동하면 시간이 흘러요. 하루 2번!')})}
  else{MODE='map';const p=G.pos||{map:'dorm',x:4,y:4,dir:'down'};warp(p.map,p.x,p.y,p.dir,true);await runCut(async()=>{await say('sys',`DAY ${G.day} ${['오전','오후','밤'][Math.min(G.slot,2)]} — 이어서 진행해요.`)})}
  WD.labelT=90;idleHint();
}
/* controls */
(function(){
  const dp=$('dpad');const set=d=>{WD.held=d;dp.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.d===d))};
  dp.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();if(chsOn()){chsMove(b.dataset.d);b.classList.add('on');setTimeout(()=>b.classList.remove('on'),120);return}try{dp.setPointerCapture(e.pointerId)}catch(_){}set(b.dataset.d)});
  dp.addEventListener('pointermove',e=>{if(!WD.held)return;const el=document.elementFromPoint(e.clientX,e.clientY);const b=el&&el.closest&&el.closest('#dpad button');if(b&&b.dataset.d!==WD.held)set(b.dataset.d)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>dp.addEventListener(ev,()=>set(null)));
  dp.addEventListener('contextmenu',e=>e.preventDefault());
  const A=$('bA');A.addEventListener('pointerdown',e=>{e.preventDefault();A.classList.add('on');actA()});['pointerup','pointercancel','pointerleave'].forEach(ev=>A.addEventListener(ev,()=>A.classList.remove('on')));
  $('bMap').onclick=()=>{if(!busy)openMap()};$('bSt').onclick=()=>{if(!busy)openStatus()};
})();
titleScreen();
</script>
<script>
(function(){const ok=e=>e.target&&e.target.closest&&e.target.closest('input,textarea');['contextmenu','selectstart','dragstart','copy'].forEach(t=>document.addEventListener(t,e=>{if(!ok(e))e.preventDefault()},{capture:true}));document.addEventListener('touchend',()=>{if(!ok({target:document.activeElement})){const g=getSelection&&getSelection();g&&g.removeAllRanges&&g.removeAllRanges()}},{passive:true});})();
</script>
</body>
</html>
